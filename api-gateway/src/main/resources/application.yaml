server:
  port: 8090

spring:
  application:
    name: ead-api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: authuser-service
              uri: http://localhost:8081/
              predicates:
                - Path=/ead-authuser/**
            - id: course-service
              uri: http://localhost:8082/
              predicates:
                - Path=/ead-courses/**